<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Transfer Receiving Report</title>
<meta name="description" content="Daily stock transfer outlet receiving — SWIMS vs store reports in Lark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='44' rx='4' fill='%23171614'/%3E%3Cpath d='M14 24h36M14 34h36M14 44h22' stroke='%23f4f1ea' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Store Transfer Receiving Report — clean, light, readable.
   One sans-serif (Inter), white cards, soft borders, clear colour.
   ============================================================ */
:root {
  color-scheme: light;
  --paper:        #f4f6f9;   /* page background */
  --surface:      #ffffff;   /* cards, rail */
  --surface-2:    #f1f4f8;   /* hover / inset */
  --ink:          #111827;   /* main text */
  --ink-2:        #374151;   /* secondary text */
  --muted:        #6b7280;   /* labels */
  --rule:         #e5e7eb;   /* borders */
  --rule-strong:  #cbd2dc;
  --swims:        #2a78d6;   /* SWIMS (system) */
  --lark:         #eb6834;   /* Lark (store report) */
  --seq-1: #dbe9fb; --seq-2: #b7d3f6; --seq-3: #86b6ef; --seq-4: #5598e7; --seq-5: #2a78d6; --seq-6: #1c5cab;
  --good:         #16a34a;
  --warn:         #f59e0b;
  --critical:     #dc2626;
  --good-text:    #15803d;
  --wash-good:    #dcfce7;
  --wash-warn:    #fef3c7;
  --wash-crit:    #fee2e2;
  --wash-swims:   #e4effb;
  --wash-lark:    #fdeae1;
  --shadow:       0 1px 2px rgba(17,24,39,.05), 0 8px 24px rgba(17,24,39,.08);
  --shadow-sm:    0 1px 2px rgba(17,24,39,.06);
  --sans:  "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:  "Inter", system-ui, sans-serif;
  --radius: 12px;
  --rail-w: 248px;
}
:root[data-theme="cream"] {
  color-scheme: light;
  --paper:        #efe9dc;   /* warm cream page background */
  --surface:      #faf6ec;   /* cards */
  --surface-2:    #f1ebdd;   /* hover / inset */
  --ink:          #2a2419;
  --ink-2:        #4a4235;
  --muted:        #7a7060;
  --rule:         #e0d7c3;
  --rule-strong:  #c9bea4;
  --wash-good:    #dcedd3;
  --wash-warn:    #f6e8c0;
  --wash-crit:    #f6dcd4;
  --wash-swims:   #e2e9ef;
  --wash-lark:    #f6e3d6;
  --shadow:       0 1px 2px rgba(60,45,20,.06), 0 8px 24px rgba(60,45,20,.08);
  --shadow-sm:    0 1px 2px rgba(60,45,20,.07);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f1115; --surface: #181b22; --surface-2: #21252e;
  --ink: #f3f4f6; --ink-2: #d1d5db; --muted: #9aa3b2;
  --rule: #2b303b; --rule-strong: #3d4351;
  --swims: #3f8ae8; --lark: #ee7a4c;
  --seq-1: #1c3a63; --seq-2: #1f4c88; --seq-3: #2460ad; --seq-4: #2f79d0; --seq-5: #5c9ce8; --seq-6: #95c0f2;
  --good: #22c55e; --warn: #fbbf24; --critical: #ef4444; --good-text: #4ade80;
  --wash-good: rgba(34,197,94,.18); --wash-warn: rgba(251,191,36,.2); --wash-crit: rgba(239,68,68,.2);
  --wash-swims: rgba(63,138,232,.18); --wash-lark: rgba(238,122,76,.2);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45); --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}
a { color: var(--swims); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- controls ---------- */
.btn {
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 8px;
  padding: 7px 14px; color: var(--ink); font-weight: 500; line-height: 1.2; font-size: 13.5px;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; box-shadow: var(--shadow-sm);
}
.btn:hover { background: var(--surface-2); }
.btn.solid { background: var(--swims); color: #fff; border-color: var(--swims); }
.btn.solid:hover { filter: brightness(1.08); }
.btn.danger { color: var(--critical); border-color: var(--critical); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn.icon { padding: 6px 9px; }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.field input, .field select, .field textarea, .input {
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 8px;
  padding: 8px 11px; color: var(--ink); width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { outline: 2px solid var(--swims); outline-offset: 0; border-color: transparent; }
.field textarea { min-height: 72px; resize: vertical; font-family: var(--sans); }
.field .hint { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px; padding: 2px; background: var(--surface); }
.seg button { border: none; background: none; border-radius: 6px; padding: 5px 14px; color: var(--ink-2); font-weight: 500; font-size: 13px; }
.seg button.on { background: var(--ink); color: #fff; }
.switch { width: 36px; height: 20px; border-radius: 999px; background: var(--rule-strong); border: none; position: relative; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--swims); }
.switch.on::after { left: 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 3px 9px;
  font-size: 12.5px; font-weight: 500; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2);
  white-space: nowrap;
}
.chip.crit { background: var(--wash-crit); border-color: transparent; color: #991b1b; }
.chip.warn { background: var(--wash-warn); border-color: transparent; color: #92400e; }
.chip.good { background: var(--wash-good); border-color: transparent; color: #166534; }
:root[data-theme="dark"] .chip.crit { color: #fca5a5; } :root[data-theme="dark"] .chip.warn { color: #fde68a; } :root[data-theme="dark"] .chip.good { color: #86efac; }
.chip.swims { background: var(--wash-swims); border-color: transparent; }
.chip.lark { background: var(--wash-lark); border-color: transparent; }
.mono { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .01em; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--muted); }
.pos { color: var(--good-text); }
.neg { color: var(--critical); }
.eyebrow { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- frame: top bar + full-width content ---------- */
#app { display: block; min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 30; background: #0f172a; color: #fff; display: flex; align-items: center; gap: 18px; padding: 0 28px; height: 58px; box-shadow: 0 1px 0 rgba(255,255,255,.06), 0 4px 16px rgba(15,23,42,.25); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 32px; height: 32px; border-radius: 8px; background: var(--swims); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 18px; height: 18px; }
.brand .t1 { font-size: 15px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
.brand .t2 { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 2px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; margin-left: 14px; }
.tabs button { background: none; border: none; color: rgba(255,255,255,.72); padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 13.5px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tabs button svg { width: 16px; height: 16px; }
.tabs button:hover { background: rgba(255,255,255,.08); color: #fff; }
.tabs button.on { background: rgba(255,255,255,.16); color: #fff; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.topbar .seg { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); }
.topbar .seg button { color: rgba(255,255,255,.75); }
.topbar .seg button.on { background: #fff; color: #0f172a; }
.userchip { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
.userchip .av { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; flex: none; }
.userchip .who { line-height: 1.2; min-width: 0; }
.userchip .who b { display: block; font-weight: 600; white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.userchip .who span { color: rgba(255,255,255,.6); font-size: 11.5px; }
.userchip .out { background: none; border: none; color: rgba(255,255,255,.6); padding: 4px; display: inline-flex; }
.userchip .out:hover { color: #fff; }
.userchip .out svg { width: 16px; height: 16px; }

/* day strip under the page title */
.daystrip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 0 6px; scrollbar-width: thin; }
.daystrip button { flex: 1 0 88px; min-width: 88px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; text-align: left; color: var(--ink-2); display: grid; gap: 5px; box-shadow: var(--shadow-sm); }
.daystrip button:hover { border-color: var(--rule-strong); }
.daystrip button.on { border-color: var(--swims); background: var(--wash-swims); box-shadow: inset 0 0 0 1px var(--swims); }
.daystrip .dw { font-size: 11.5px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
.daystrip button.on .dw { color: var(--swims); }
.daystrip .n { font-size: 15px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.daystrip .n.none { color: var(--muted); font-weight: 400; }
.daystrip .bar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; position: relative; }
.daystrip .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--swims); border-radius: 3px; }
.daystrip .bar i.weekend { background: var(--rule-strong); }
.daystrip .flag { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--critical); }

main { padding: 22px 28px 60px; max-width: 1640px; margin: 0 auto; min-width: 0; }

.masthead { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 4px 0 14px; }
.masthead .date { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin: 2px 0 0; }
.masthead .date em { font-style: normal; font-weight: 500; color: var(--ink-2); }
.masthead .datenav { display: flex; gap: 6px; align-items: center; }
.masthead .datenav input[type=date] { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.masthead .meta { margin-left: auto; text-align: right; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.masthead .meta .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--good); vertical-align: 0; }
.masthead .meta .dot.stale { background: var(--warn); }
.masthead .meta .dot.off { background: var(--critical); }
/* figures: KPI cards */
.figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.fig { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px 14px; min-width: 0; box-shadow: var(--shadow-sm); }
.fig .lab { font-size: 13px; color: var(--ink-2); font-weight: 500; display: flex; align-items: center; gap: 7px; }
.fig .lab .key { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.fig .val { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 6px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.fig .val .unit { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.fig .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fig .spark { height: 28px; margin-top: 10px; }
.fig .spark svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* sections as cards */
.section { margin-top: 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 20px 20px; box-shadow: var(--shadow-sm); }
.section > header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.section > header h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.section > header .sub { color: var(--muted); font-size: 12.5px; }
.section > header .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filterrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 8px; }
.filterrow .search { width: 220px; padding: 6px 12px; border-radius: 8px; }
.filterrow .chips { display: flex; gap: 4px; flex-wrap: wrap; }
.filterrow .chips button { border: 1px solid transparent; background: none; border-radius: 8px; padding: 5px 11px; color: var(--ink-2); font-size: 13px; font-weight: 500; }
.filterrow .chips button:hover { background: var(--surface-2); }
.filterrow .chips button.on { background: var(--ink); color: #fff; }
.filterrow label.tog { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-left: 6px; }

/* attention list */
.attn { border-top: 1px solid var(--rule); }
.attn .row { display: grid; grid-template-columns: 170px 1fr; gap: 14px; padding: 11px 8px; border-bottom: 1px solid var(--rule); align-items: start; cursor: pointer; border-radius: 6px; }
.attn .row:hover { background: var(--surface-2); }
.attn .store b { font-weight: 700; }
.attn .store span { display: block; color: var(--muted); font-size: 12.5px; }
.attn .why { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.attn .why .rem { color: var(--ink-2); font-size: 13px; }
.allclear { padding: 14px 0; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }

/* ledger table */
.tablewrap { overflow-x: auto; }
table.ledger { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.ledger th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 10px 10px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 2; }
table.ledger th.num, table.ledger td.num { text-align: right; }
table.ledger td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
table.ledger tr.grp td { padding: 16px 10px 6px; border-bottom: 1px solid var(--rule-strong); font-size: 13.5px; font-weight: 700; color: var(--ink); background: var(--surface); }
table.ledger tr.grp td span { font-size: 12px; color: var(--muted); margin-left: 10px; font-weight: 500; }
table.ledger tr.r { cursor: pointer; }
table.ledger tr.r:hover td { background: var(--surface-2); }
table.ledger tr.r.issue td:first-child { box-shadow: inset 3px 0 0 var(--critical); }
table.ledger tr.r.warn td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
table.ledger .code { font-weight: 700; }
table.ledger .nm { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
table.ledger .bar { display: inline-block; height: 8px; border-radius: 4px; vertical-align: middle; }
table.ledger .bar.s { background: var(--swims); }
table.ledger .bar.l { background: var(--lark); }
table.ledger .cellbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
table.ledger .cellbar .v { min-width: 44px; text-align: right; font-weight: 500; }
table.ledger td.rem { color: var(--ink-2); max-width: 340px; }
table.ledger td.rem .st { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-right: 6px; }
table.ledger td.rem i { font-style: normal; }
table.ledger .open { white-space: nowrap; }
table.ledger .open small { color: var(--muted); }
table.ledger td.na { color: var(--rule-strong); }
.delta { font-variant-numeric: tabular-nums; font-weight: 600; }
.delta.zero { color: var(--muted); font-weight: 400; }
.srcicons { display: inline-flex; gap: 4px; }
.srcicons i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; background: var(--rule); }
.srcicons i.on.s { background: var(--swims); }
.srcicons i.on.l { background: var(--lark); }
.legend { display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.legend .k i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.empty { padding: 36px 0; text-align: center; color: var(--muted); }
.empty .big { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }

/* matrix (stores x days) */
.matrix { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
.matrix th { font-weight: 500; color: var(--muted); font-size: 11px; padding: 2px 4px; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.matrix th.rowh { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; color: var(--ink); font-weight: 600; padding-right: 10px; font-size: 12.5px; }
.matrix th.rowh span { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 11px; }
.matrix th.wk { color: var(--rule-strong); }
.matrix td { width: 26px; height: 24px; border-radius: 4px; background: var(--surface-2); position: relative; cursor: pointer; }
.matrix td.wkend { background: transparent; border: 1px solid var(--rule); }
.matrix td.q1 { background: var(--seq-1); } .matrix td.q2 { background: var(--seq-2); } .matrix td.q3 { background: var(--seq-3); }
.matrix td.q4 { background: var(--seq-4); } .matrix td.q5 { background: var(--seq-5); } .matrix td.q6 { background: var(--seq-6); }
.matrix td.mis::after { content: ""; position: absolute; right: 3px; top: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--critical); box-shadow: 0 0 0 2px var(--surface); }
.matrix td.norep::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 2px; margin: -1px 0 0 -5px; background: var(--lark); }
.matrix td:hover, .matrix td:focus-visible { outline: 2px solid var(--ink); outline-offset: -1px; }
.matrix td.today { outline: 1px dashed var(--rule-strong); }
.matrix tr.grp th { padding-top: 14px; font-size: 13px; font-weight: 700; color: var(--ink); text-align: left; }
.scalebar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.scalebar i { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(17,24,39,.4); z-index: 50; display: none; }
.scrim.open { display: block; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface);
  border-left: 1px solid var(--rule); box-shadow: var(--shadow); z-index: 51; transform: translateX(100%);
  transition: transform .2s ease; overflow-y: auto; padding: 26px 28px 40px;
}
.drawer.open { transform: none; }
.drawer h3 { font-size: 20px; font-weight: 700; margin: 4px 0 0; letter-spacing: -.01em; }
.drawer .dsub { color: var(--muted); font-size: 12.5px; margin: 6px 0 18px; }
.drawer .close { position: absolute; top: 18px; right: 18px; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 50%; width: 32px; height: 32px; color: var(--ink-2); }
.drawer .close:hover { background: var(--surface-2); }
.drawer h4 { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 22px 0 8px; }
.drawer .form { display: grid; gap: 14px; }
.drawer .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.drawer .actions { display: flex; gap: 8px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
.drawer .err { color: var(--critical); font-size: 13px; }
.drawer .ok { color: var(--good-text); font-size: 13px; }
.txnlist { border-top: 1px solid var(--rule); }
.txnlist .t { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.txnlist .t .no { font-weight: 600; }
.txnlist .t .nm { color: var(--muted); font-size: 12px; grid-column: 1; }

// Transfers open "as of" a day: still-open ones dispatched by then, plus ones received only later.
function txnIndex(country) {

  const idx = [];
  for (const [d, stores] of Object.entries(f.days)) for (const [c, s] of Object.entries(stores)) for (const t of s.t)
    if (t.s === "Received" && t.td) idx.push({ c, n: t.n, w: t.w, d: t.d, q: t.q, r: 0, s: "In transit", td: t.td, rd: d });

}

  const lk = state.lark[country] && state.lark[country][date] && state.lark[country][date][code];
  const open = openAsOf(country, date, code);
  const st = storeOf(code);
  const rec = { code, store: st, swims: sw ? sw.p : (cov === "full" ? null : undefined), txns: sw ? sw.t : [], lark: lk || null, open, flags: [], coverage: cov };
  const tol = state.settings.tolerance || 0;
  const over = rec.txns.filter(t => t.r > t.q);
  if (over.length) rec.flags.push({ k: "over", cls: "warn", text: "System shows more received than was sent (" + over.map(t => "+" + (t.r - t.q)).join(", ") + ")" });
  if (cov === "full" && lk && sw && lk.pcs != null && Math.abs(lk.pcs - sw.p) > tol) {
    const dd = lk.pcs - sw.p;
    rec.flags.push({ k: "mismatch", cls: "crit", text: "Numbers don't match: store said " + fmt(lk.pcs) + ", system shows " + fmt(sw.p) + " (" + (dd > 0 ? "+" : "") + fmt(dd) + ")" });
  }
  if (cov === "full" && lk && lk.pcs > 0 && !sw) rec.flags.push({ k: "larkonly", cls: "warn", text: "Store says it received " + fmt(lk.pcs) + " pcs, but nothing was scanned in the system" });
  // "Not reported" only once store reports exist for this country at all (rollout period stays quiet)
  const la = larkActive(country);
  const isToday = date === todayStr();
  if (la && !lk && sw && sw.p > 0) rec.flags.push({ k: "norep", cls: "crit", text: isToday ? "Store hasn't sent today's report" : "Store didn't send a report" });
  if (la && !lk && !sw && cov === "full" && state.settings.requireDailyReport && dow(date) !== 0) rec.flags.push({ k: "norep", cls: "warn", text: "No daily report from the store" });
  if (lk && (lk.status === "issue" || lk.status === "partial")) rec.flags.push({ k: "issue", cls: "crit", text: lk.status === "partial" ? "Store reported short or damaged stock" : "Store reported a problem" });
  const old = cov === "none" ? [] : open.filter(o => daysBetween(o.td, date) >= (state.settings.openDays || 2));
  const oldestDays = old.length ? Math.max(...old.map(o => daysBetween(o.td, date))) : 0;

/* ============================== LARK MESSAGE PARSER ============================== */
// Understands the usual ways stores write the daily line, e.g.
//   "ABJ 120pcs received"  ·  "TJE - no delivery today"  ·  "SMS: 85 pcs, 2 cartons short, STO-TF-26005162"
//   "AMM 没有收货"  ·  "ACL received 64 pcs (1 carton still with courier)"
const NONE_WORDS = /\b(no\s+(delivery|stock|goods|transfer|receiv\w*)|nothing|not\s+receiv\w*|didn'?t\s+receive|nil|none)\b|没有|沒有|无到货|未收到|没收|沒收/i;
const SHORT_WORDS = /\b(short|missing|less|partial|incomplete|damage\w*|wrong|extra|tally|discrepan\w*|not\s+tally)\b|少|缺|损坏|破损|不对|多了/i;
function parseLarkText(text, country) {
  const codes = Object.values(state.stores).filter(s => !country || s.country === country).map(s => s.code).sort((a, b) => b.length - a.length);
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    const up = line.toUpperCase();
    const code = codes.find(c => new RegExp("(^|[^A-Z0-9])" + c.replace("-", "\\-") + "(?![A-Z0-9])", "i").test(up));
    if (!code) { out.push({ raw: line, ok: false, why: "no store code" }); continue; }
    const rest = line.replace(new RegExp(code.replace("-", "\\-"), "i"), " ").replace(/^[\s:\-–—,.]+/, "");
    const m = rest.match(/(\d[\d,]*)\s*(pcs?|pieces?|pc|件)?/i);
    let pcs = m ? parseInt(m[1].replace(/,/g, ""), 10) : null;
    let status = "received";
    if (NONE_WORDS.test(rest)) { status = "none"; if (pcs == null) pcs = 0; }
    else if (SHORT_WORDS.test(rest)) status = "partial";
    else if (pcs == null) status = "issue";
    if (pcs === 0 && status === "received") status = "none";
    const remark = rest.replace(m ? m[0] : "", "").replace(/\b(received|receive|rcv|recd)\b/ig, "").replace(/\s{2,}/g, " ").replace(/^[\s:\-–—,.]+|[\s:\-–—,.]+$/g, "").trim();
    out.push({ raw: line, ok: true, code, pcs, status, remark });
  }
  return out;
}

    h("button", { class: "btn solid", type: "submit", style: { justifyContent: "center" } }, mode === "signin" ? "Sign in" : mode === "signup" ? "Create account" : "Send reset link"),
    err, ok,
    h("div", { class: "links" },
      mode === "signin" ? (state.settings.allowSelfSignup !== false ? h("a", { href: "#", onclick: e => { e.preventDefault(); showLogin("signup"); } }, "Create account") : h("span")) : h("a", { href: "#", onclick: e => { e.preventDefault(); showLogin("signin"); } }, "Back to sign in"),
      mode === "signin" ? h("a", { href: "#", onclick: e => { e.preventDefault(); showLogin("reset"); } }, "Forgot password?") : null));
  document.getElementById("root").replaceChildren(h("div", { class: "auth" }, authSide(), h("div", { class: "box" }, form)));
  email.focus();
}
function friendlyAuthError(ex) {
  const c = (ex && ex.code) || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Email or password is incorrect.";
  if (c.includes("email-already-in-use")) return "That email already has an account — sign in instead.";
  if (c.includes("weak-password")) return "Password needs at least 6 characters.";
  if (c.includes("too-many-requests")) return "Too many attempts — wait a few minutes.";
  if (c.includes("invalid-email")) return "That email address doesn't look right.";
  return (ex && ex.message) || String(ex);
}
function showGate(title, text, extra) {
  document.getElementById("root").replaceChildren(h("div", { class: "gate" }, h("div", { class: "inner" }, h("div", { class: "eyebrow" }, "Store Transfer Receiving Report"), h("h2", null, title), h("p", null, text),
    h("div", { style: { display: "flex", gap: "8px", justifyContent: "center" } }, extra, h("button", { class: "btn", onclick: () => auth.signOut() }, "Sign out")))));
}

/* ============================== BOOT ============================== */
async function boot() {
  applyTheme();
  state.date = todayStr();
  if (!FIREBASE_CONFIG) {
    DB = makeDemoDB();
    state.user = { uid: "u1", email: ADMIN_EMAIL, name: "Thian Wei", role: "admin", countries: ["SG", "MY"], allStores: true };
    await loadAll(); return;
  }
  document.getElementById("root").replaceChildren(h("div", { class: "loading" }, "Opening the ledger…"));
  const v = "10.14.1";
  await loadScript("https://www.gstatic.com/firebasejs/" + v + "/firebase-app-compat.js");
  await Promise.all([loadScript("https://www.gstatic.com/firebasejs/" + v + "/firebase-auth-compat.js"), loadScript("https://www.gstatic.com/firebasejs/" + v + "/firebase-firestore-compat.js")]);
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); fsdb = firebase.firestore();
  DB = makeFirestoreDB();
  try { const d = await fsdb.collection("config").doc("app").get(); if (d.exists) state.settings = { ...DEFAULT_SETTINGS, ...d.data() }; } catch (e) { /* public read may be denied before sign-in; defaults apply */ }
  auth.onAuthStateChanged(async fbUser => {
    if (!fbUser) { state.user = null; showLogin("signin"); return; }
    try {
      const ref = fsdb.collection("users").doc(fbUser.uid);
      let snap = await ref.get();
      if (!snap.exists) {
        const isAdmin = (fbUser.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();
        await ref.set({ email: fbUser.email, name: fbUser.displayName || "", role: isAdmin ? "admin" : "pending", countries: isAdmin ? COUNTRIES.map(c => c.id) : [], allStores: true, stores: [], active: true, locked: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        snap = await ref.get();
      }
      state.user = { uid: fbUser.uid, ...snap.data() };
      const u = state.user;
      if (u.locked) return showGate("Account locked", "An Administrator has locked this account. Contact them if that's a mistake.");
      if (u.active === false) return showGate("Account inactive", "This account is switched off. An Administrator can reactivate it under Settings → Users.");
      if (!u.role || u.role === "pending" || (u.role !== "admin" && !roleInfo(u.role))) {
        try { state.roles = await DB.loadRoles(); } catch (e) {}
        if (!u.role || u.role === "pending" || (u.role !== "admin" && !roleInfo(u.role))) return showGate("Waiting for approval", "You're signed in as " + u.email + ". An Administrator needs to give you a role before you can see the ledger.");
      }
      await loadAll();
      if (u.role !== "admin" && !visibleCountries().length) return showGate("No country access yet", "Ask an Administrator to tick Singapore and/or Malaysia for your account.");
    } catch (e) { console.error(e); showGate("Something went wrong", (e && e.message) || String(e)); }
  });
}
window.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
boot();
</script>
